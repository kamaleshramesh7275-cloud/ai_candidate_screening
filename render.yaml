version: "1"

databases:
  - name: ai-screening-db
    databaseName: ai_recruiter
    plan: free
    region: oregon

services:
  # ── Unified Web Service ──────────────────────────────────────────────────
  - type: web
    name: ai-screening-app
    runtime: node
    region: oregon
    plan: free
    # Run from the root so we can build both frontend and backend
    rootDir: .
    buildCommand: cd frontend && npm install --include=dev && npm run build && cd ../backend && npm install --include=dev && npm run build && npx prisma migrate deploy
    startCommand: cd backend && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-screening-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # Render auto-generates a secret
      - key: RECRUITER_PASSWORD
        value: admin                 # Change this in the Render dashboard after deploy!
      - key: PORT
        value: "3001"
