version: "1"

databases:
  - name: ai-screening-db
    databaseName: ai_recruiter
    plan: free
    region: oregon

services:
  # ── Backend API ──────────────────────────────────────────────────────────────
  - type: web
    name: ai-screening-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ai-screening-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true          # Render auto-generates a secret
      - key: RECRUITER_PASSWORD
        value: admin                 # Change this in the Render dashboard after deploy!
      - key: PORT
        value: "3001"

  # ── Frontend (Next.js SSR) ────────────────────────────────────────────────
  - type: web
    name: ai-screening-frontend
    runtime: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ai-screening-backend
          property: host
          # Render exposes the service's https host; prefix with https://
          # After deploy, manually set this to: https://<backend-service>.onrender.com
